name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Test
        run: uv run pytest --cov=designdex --cov-report=term-missing

  lint:
    name: lint and format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format
        run: uv run ruff format --check --diff .

  package:
    name: build and run the installed wheel
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"

      - name: Build
        run: uv build

      - name: Install the wheel and use it from a different directory
        run: |
          wheel="$(ls "$PWD"/dist/*.whl)"
          cd "$RUNNER_TEMP"
          uvx --from "$wheel" designdex "glassmorphism" --max-results 1
          uvx --from "$wheel" designdex "useMemo" --stack react --max-results 1
