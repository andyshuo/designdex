[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "designdex"
version = "0.1.0"
description = "A searchable index of UI/UX design decisions, ranked with BM25"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Andy Kuo Tsai Shuo" }]
keywords = [
    "design-system",
    "bm25",
    "information-retrieval",
    "ui",
    "ux",
    "typography",
    "accessibility",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Text Processing :: Indexing",
]
dependencies = []

[project.scripts]
designdex = "designdex.cli:main"

[project.urls]
Homepage = "https://github.com/andyshuo/designdex"
Issues = "https://github.com/andyshuo/designdex/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4"]

[tool.hatch.build.targets.wheel]
packages = ["src/designdex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "BLE", "LOG", "PLW"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
